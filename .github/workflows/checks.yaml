name: Checks

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.devcontainer/**'
      - '.vscode/**'
      - '.gitignore'
      - 'README.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '.devcontainer/**'
      - '.vscode/**'
      - '.gitignore'
      - 'README.md'
  workflow_call:
    inputs:
      dummy:
        type: string
        required: false

jobs:
  cpu-tests:
    name: CPU regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv venv --python 3.12
      - name: Install CPU test dependencies
        run: |
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install -r requirements/cpu-tests.txt
          uv pip install --no-deps -e .
      - name: Run CPU tests without vLLM or model downloads
        run: .venv/bin/python -m pytest tests/unit examples/tests/test_r_lens_rules.py --junitxml=cpu-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-results
          path: cpu-results.xml

  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync
      - name: Ruff lint
        run: uv run ruff check
      - name: Ruff format
        run: uv run ruff format --check
      - name: Pyright
        run: uv run pyright

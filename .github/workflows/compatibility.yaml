name: vLLM compatibility

on:
  workflow_dispatch:
    inputs:
      suite:
        description: GPU suite (parallel requires two GPUs)
        type: choice
        options: [smoke, parallel]
        default: smoke
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: vllm-compatibility
  cancel-in-progress: false

jobs:
  configuration:
    # Weekly checks start once a GPU runner label is configured. A manual run
    # without one fails explicitly rather than reporting an empty green matrix.
    if: github.event_name != 'schedule' || vars.VLLM_LENS_GPU_RUNNER != ''
    runs-on: ubuntu-latest
    steps:
      - name: Require a configured GPU runner
        env:
          GPU_RUNNER: ${{ vars.VLLM_LENS_GPU_RUNNER }}
        run: |
          if [ -z "$GPU_RUNNER" ]; then
            echo 'Set VLLM_LENS_GPU_RUNNER to a self-hosted GPU runner label; see docs/compatibility.md.'
            exit 1
          fi

  gpu:
    needs: configuration
    name: vLLM ${{ matrix.vllm }} / ${{ inputs.suite || 'smoke' }}
    runs-on: [self-hosted, linux, x64, '${{ vars.VLLM_LENS_GPU_RUNNER }}']
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        vllm: ['0.19.0', '0.30.0']
    env:
      UV_PROJECT_ENVIRONMENT: .venv-compatibility
      VLLM_VERSION: ${{ matrix.vllm }}
      SUITE: ${{ inputs.suite || 'smoke' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install each target in a fresh environment
        run: |
          uv venv --clear --python 3.12 .venv-compatibility
          uv pip install --python .venv-compatibility/bin/python "vllm==$VLLM_VERSION" -e . -r requirements/compatibility-tests.txt
      - name: Validate values and intervention effects
        run: .venv-compatibility/bin/python scripts/check_compatibility.py --expected-vllm "$VLLM_VERSION" --suite "$SUITE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-vllm-${{ matrix.vllm }}-${{ inputs.suite || 'smoke' }}
          path: compatibility-results/
